name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Migrations match the models
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci.db
        run: |
          python scripts/init_db.py
          python -m alembic check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type-check, unit tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Legacy JavaScript syntax (fallback UI)
        run: for f in app/static/js/*.js; do node --check "$f"; done
